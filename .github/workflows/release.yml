name: Android APK Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta del release (p. ej. v1.0.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Android NDK + cmake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      # --local compila en el runner: no consume la cuota de builds de la nube y firma con la
      # misma credencial de EAS (el APK actualiza encima del instalado).
      - name: Build APK (EAS local)
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: artifacts
        run: eas build -p android --profile preview --local --non-interactive
      - name: Recoger APK
        run: cp "$(ls artifacts/*.apk | head -n1)" polar-locate.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" polar-locate.apk --title "$TAG" --generate-notes
          # El QR apunta al asset de GitHub: no caduca y se descarga desde el movil.
          APK_URL="https://github.com/$REPO/releases/download/$TAG/polar-locate.apk"
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=$APK_URL"
          BODY=$(gh release view "$TAG" --json body -q .body)
          gh release edit "$TAG" --notes "$(printf '%s\n\n### Descarga del APK (escanea el QR)\n\n[![QR de descarga](%s)](%s)\n\n- GitHub: %s\n' "$BODY" "$QR_URL" "$APK_URL" "$APK_URL")"
