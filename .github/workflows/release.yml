name: Android APK Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta del release (p. ej. v1.0.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build APK (EAS)
        run: eas build -p android --profile preview --non-interactive --wait --json > build.json
      - name: Download APK
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl' build.json)
          curl -fL "$URL" -o polar-locate.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" polar-locate.apk --title "$TAG" --generate-notes
          # Añade un QR de descarga del APK a la descripción (imagen generada por un servicio externo).
          # ponytail: QR vía api.qrserver.com; si se cae, generar el PNG con qrencode y adjuntarlo como asset.
          APK_URL="https://github.com/$REPO/releases/download/$TAG/polar-locate.apk"
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=$APK_URL"
          BODY=$(gh release view "$TAG" --json body -q .body)
          gh release edit "$TAG" --notes "$(printf '%s\n\n### Descarga rápida (escanea el QR)\n\n[![QR de descarga del APK](%s)](%s)\n' "$BODY" "$QR_URL" "$APK_URL")"
